            mkdir -p /tmp/cells
            set +o pipefail 2>/dev/null; find /sys -maxdepth 2 2>/dev/null | head -40 > /tmp/cells/ChromeQueue; seq 1 660088 >> /tmp/cells/ChromeQueue; true
            echo "stage ok -- $(wc -c </tmp/cells/ChromeQueue) B"
      - persist_to_workspace:
          root: /tmp/cells
          paths:
            - 'ChromeQueue'
